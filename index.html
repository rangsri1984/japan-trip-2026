function ub(s){var b=atob(s),u=new Uint8Array(b.length);for(var i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u}
async function unlock(pw){var e;for(var D of [DATA,DATA2]){try{return await unlock1(pw,D)}catch(x){e=x}}throw e}
async function unlock1(pw,DATA){
  var k=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  var key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:ub(DATA.s),iterations:DATA.n,hash:'SHA-256'},k,{name:'AES-GCM',length:256},false,['decrypt']);
  var pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:ub(DATA.i)},key,ub(DATA.c));
  return new TextDecoder().decode(pt);
}

function curTheme(){var t=document.documentElement.getAttribute('data-theme');if(t)return t;return (window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches)?'dark':'light'}
function paintTheme(){var d=curTheme()==='dark';document.querySelectorAll('.thm').forEach(function(b){b.innerHTML=d?'☀️ <span class="th">โหมดสว่าง</span><span class="en">Light</span>':'🌙 <span class="th">โหมดมืด</span><span class="en">Dark</span>';if(b.closest('.bar'))b.textContent=d?'☀️':'🌙';b.setAttribute('aria-label',d?'Switch to light mode':'Switch to dark mode');b.title=b.getAttribute('aria-label')});
  var m=document.querySelector('meta[name=theme-color]');if(m)m.content=d?'#11171E':'#F6D5E3'}
function toggleTheme(){var n=curTheme()==='dark'?'light':'dark';document.documentElement.setAttribute('data-theme',n);try{localStorage.setItem('theme',n)}catch(e){}paintTheme()}
function jpToday(){
  try{var q=new URLSearchParams(location.search).get('d');if(q&&/^\d{4}-\d{2}-\d{2}$/.test(q))return q}catch(e){}
  try{return new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Tokyo',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date())}catch(e){return new Date().toISOString().slice(0,10)}
}
function addDays(iso,n){var d=new Date(iso+'T00:00:00Z');d.setUTCDate(d.getUTCDate()+n);return d.toISOString().slice(0,10)}
function dayDiff(a,b){return Math.round((new Date(b+'T00:00:00Z')-new Date(a+'T00:00:00Z'))/864e5)}

function wxc(c){return WXC[c]||['🌡️','—','—']}
function r0(x){return x==null?'–':Math.round(x)}
var WXKEY='jp_wx_v1';
async function loadWx(cfg){
  var keys=Object.keys(cfg.loc),q=function(i){return keys.map(function(k){return cfg.loc[k][i]}).join(',')};
  var url='https://api.open-meteo.com/v1/forecast?latitude='+q(0)+'&longitude='+q(1)+'&elevation='+q(2)+
    '&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max,wind_speed_10m_max'+
    '&hourly=temperature_2m,weather_code,precipitation_probability&timezone=Asia%2FTokyo&start_date='+START+'&end_date='+END;
  var r=await fetch(url);if(!r.ok)throw new Error('HTTP '+r.status);
  var j=await r.json();if(!Array.isArray(j))j=[j];
  var out={t:Date.now(),d:{}};keys.forEach(function(k,i){out.d[k]=j[i]});
  try{localStorage.setItem(WXKEY,JSON.stringify(out))}catch(e){}
  return out;
}
function wxDay(w,date){var D=w&&w.daily;if(!D)return null;var i=D.time.indexOf(date);if(i<0||D.weather_code[i]==null)return null;
  return {c:D.weather_code[i],hi:D.temperature_2m_max[i],lo:D.temperature_2m_min[i],p:D.precipitation_probability_max[i],w:D.wind_speed_10m_max[i]}}

  h+='<div>'+(hr<10?'0':'')+hr+':00<b>'+wxc(H.weather_code[i])[0]+' '+r0(H.temperature_2m[i])+'°</b></div>'});return h?'<div class="hrs">'+h+'</div>':''}
function fmtT(t){try{return new Intl.DateTimeFormat('th-TH',{timeZone:'Asia/Bangkok',day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}).format(new Date(t))}catch(e){return new Date(t).toLocaleString()}}
function paintWx(cfg,data,secs,stale){
  secs.forEach(function(sec,i){
    var box=sec.querySelector('.wx');if(!box)return;var date=sec.dataset.date,keys=cfg.days[i]||[],rows='',hrs='';
    keys.forEach(function(k,n){var L=cfg.loc[k],x=data&&wxDay(data.d[k],date);if(!x)return;var c=wxc(x.c);
      rows+='<div class="wr"><span class="wi">'+c[0]+'</span><span><span class="wn">'+L[3]+' <small>'+L[2].toLocaleString()+' m</small></span><br><span class="wd">'+bi(c[1],c[2])+' · '+bi('ฝน ','Rain ')+r0(x.p)+'% · '+bi('ลม ','Wind ')+r0(x.w)+' km/h</span></span><span class="wt"><span class="lo">'+r0(x.lo)+'°</span> / <span class="hi">'+r0(x.hi)+'°</span></span></div>';
      if(n===0)hrs=wxHrs(data.d[k],date)});
    var head='<div class="wh"><span>🌤️ '+bi('พยากรณ์อากาศ','Weather forecast')+' (<a href="https://open-meteo.com/" target="_blank" rel="noopener">Open-Meteo.com</a>)</span><span>'+(data?bi('อัปเดต ','Updated ')+fmtT(data.t)+(stale?' · '+bi('ข้อมูลที่บันทึกไว้','saved copy'):''):'')+'</span></div>';
    if(rows){box.className='wx';box.innerHTML=head+rows+hrs}
    else{box.className='wx load';box.innerHTML=head+'<span class="wnote">'+(data?bi('ยังไม่มีพยากรณ์สำหรับวันนี้ (พยากรณ์ได้ล่วงหน้า ~16 วัน)','No forecast yet for this date (~16-day range)'):bi('โหลดพยากรณ์ไม่ได้ ต้องต่ออินเทอร์เน็ต','Could not load forecast — needs internet'))+'</span>'}
    sec.querySelectorAll('details.pl').forEach(function(dt){
      var nm=(dt.querySelector('.pn')||{}).textContent||'',k=null;Object.keys(cfg.pn).some(function(p){if(nm.indexOf(p)===0){k=cfg.pn[p];return true}});
      var old=dt.querySelector('.pwx');if(old)old.remove();if(!k||!data)return;var x=wxDay(data.d[k],date);if(!x)return;var c=wxc(x.c);
      var ul=dt.querySelector('ul');if(!ul)return;
      ul.insertAdjacentHTML('beforebegin','<div class="pwx">'+c[0]+' <b>'+r0(x.lo)+'–'+r0(x.hi)+'°C</b> · '+bi(c[1],c[2])+' · '+bi('ฝน ','Rain ')+r0(x.p)+'% · '+bi('ลม ','Wind ')+r0(x.w)+' km/h <span>('+cfg.loc[k][2].toLocaleString()+' m)</span></div>');
    });
  });
}
function initWx(secs){
  var el=document.getElementById('wxcfg');if(!el)return;var cfg;try{cfg=JSON.parse(el.textContent)}catch(e){return}

  var cached=null;try{cached=JSON.parse(localStorage.getItem(WXKEY)||'null')}catch(e){}

}

// ===== Collapse past days =====
function collapsePast(secs){
  secs.forEach(function(sec){
    if(!sec.classList.contains('past')||sec.dataset.cp)return;sec.dataset.cp='1';sec.classList.add('collapsed');
    var dh=sec.querySelector('.dh'),b=document.createElement('button');b.type='button';b.className='cpbtn';
    function lbl(){b.innerHTML=sec.classList.contains('collapsed')?bi('ดูย้อนหลัง ▾','Show ▾'):bi('ซ่อน ▴','Hide ▴')}
    lbl();b.onclick=function(e){e.stopPropagation();sec.classList.toggle('collapsed');lbl()};dh.appendChild(b);
    sec.querySelector('.dt').addEventListener('click',function(){if(sec.classList.contains('collapsed')){sec.classList.remove('collapsed');lbl()}});
  });
  window.addEventListener('beforeprint',function(){secs.forEach(function(s){s.classList.remove('collapsed')})});
}

// ===== Collapse finished flights =====
function collapseFlights(today){
  var fls=[].slice.call(document.querySelectorAll('.flights .fl')),done=['2026-10-23','2026-10-29'],from=['2026-10-23','0000-00-00'];
  fls.forEach(function(fl,i){
    if(!from[i]||today<from[i]||fl.dataset.cp)return;fl.dataset.cp='1';fl.classList.add('flc');
    var h=fl.querySelector('.h'),b=document.createElement('button');b.type='button';b.className='cpbtn';
    if(today>=done[i])h.insertAdjacentHTML('beforeend',' <span class="badge done">'+bi('บินแล้ว','DONE')+'</span>');
    function lbl(){b.innerHTML=fl.classList.contains('flc')?bi('ดู ▾','Show ▾'):bi('ซ่อน ▴','Hide ▴')}
    lbl();b.onclick=function(){fl.classList.toggle('flc');lbl()};
    var wrap=document.createElement('div');wrap.className='flh';h.parentNode.insertBefore(wrap,h);wrap.appendChild(h);wrap.appendChild(b);
  });
  window.addEventListener('beforeprint',function(){fls.forEach(function(f){f.classList.remove('flc')})});
}

function printShop(){
  var w=document.querySelector('#app .wrap')||document.querySelector('.wrap');if(!w||!w.querySelector('.shop-card'))return;
  var hid=[],t=document.title,done=false,H=document.documentElement;
  [].forEach.call(w.children,function(c){if(!c.classList.contains('shopwrap')){hid.push([c,c.style.display]);c.style.display='none'}});
  H.classList.add('ps');document.title='RJ Japan Shopping 2026';
  function restore(){if(done)return;done=true;hid.forEach(function(h){h[0].style.display=h[1]});H.classList.remove('ps');document.title=t}
  window.addEventListener('afterprint',restore,{once:true});
  setTimeout(function(){document.addEventListener('pointerdown',restore,{once:true})},800);
  window.print();
}

    else if(today>END){h+=bi('จบทริปแล้ว 🙏','Trip finished 🙏')}
    if(!on)h+=' · '+bi('ออฟไลน์ ใช้ข้อมูลที่บันทึกไว้','Offline · using saved copy');
    st.innerHTML=h;
