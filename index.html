<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>RJ Japan Trip</title><meta name="robots" content="noindex,nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bai+Jamjuree:wght@600;700&family=Noto+Sans+Thai:wght@400;500;600&display=swap">
<style>
:root{--bg:#EEF2F5;--card:#FFFFFF;--soft:#F6F8FA;--ink:#1B2A3A;--muted:#5A6B7B;--line:#D9E0E6;--accent:#C2511F;--btn:#1F6FB2;--btnink:#FFFFFF;--tagbg:#E3EBF3;--tagink:#1F4B75;
--display:"Bai Jamjuree","Noto Sans Thai",system-ui,sans-serif;--body:"Noto Sans Thai",system-ui,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#11171E;--card:#18212B;--soft:#1E2934;--ink:#E6ECF2;--muted:#9AA9B8;--line:#2B3845;--accent:#F08A5D;--btn:#3B8BD4;--btnink:#FFFFFF;--tagbg:#22374D;--tagink:#BFD7EE;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#11171E;--card:#18212B;--soft:#1E2934;--ink:#E6ECF2;--muted:#9AA9B8;--line:#2B3845;--accent:#F08A5D;--btn:#3B8BD4;--btnink:#FFFFFF;--tagbg:#22374D;--tagink:#BFD7EE;color-scheme:dark}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px}
.en{display:none}
#lang:checked ~ .wrap .th{display:none}
#lang:checked ~ .wrap .en{display:inline}
.lt{position:absolute;opacity:0;pointer-events:none}
.wrap{max-width:720px;margin:0 auto;padding-block:20px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:16px}
.bar{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.sw2{display:inline-flex;border:1px solid var(--line);border-radius:999px;background:var(--card);padding:3px;cursor:pointer;user-select:none;font-size:13px;font-weight:600}
.sw2 span{display:inline-block;padding:6px 12px;border-radius:999px;color:var(--muted)}
.sw2 .o1{background:var(--ink);color:var(--bg)}
#lang:checked ~ .wrap .sw2 .o1{background:none;color:var(--muted)}
#lang:checked ~ .wrap .sw2 .o2{background:var(--ink);color:var(--bg)}
#lang:focus-visible ~ .wrap .sw2{outline:2px solid var(--accent);outline-offset:2px}
.pdf{font:inherit;font-size:13px;font-weight:600;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:9px 14px;cursor:pointer}
.pdf:hover{border-color:var(--btn)}
.pdf:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.pdf[hidden]{display:none}
.msg{font-size:12.5px;color:var(--muted);text-align:right;min-height:0}
.eyebrow{font-size:13px;font-weight:600;letter-spacing:.08em;color:var(--accent)}
h1{margin:0;font-family:var(--display);font-size:clamp(30px,7vw,44px);line-height:1.1;text-wrap:balance}
.sub{font-size:14px;color:var(--muted)}
.flights{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.fl{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:4px;font-size:14px}
.fl b{font-family:var(--display);font-variant-numeric:tabular-nums}
.fl .h{font-size:12px;font-weight:600;letter-spacing:.08em;color:var(--accent)}
#days{display:flex;flex-direction:column;gap:14px}
.day{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px;display:flex;flex-direction:column;gap:8px;min-width:0}
.dh{display:flex;align-items:center;gap:8px;font-weight:600;font-size:14px;color:var(--muted)}
.sw{width:12px;height:12px;border-radius:3px;flex:none}
.dt{font-family:var(--display);font-weight:700;font-size:22px;line-height:1.2}
.sched{margin:0;padding:0;list-style:none;font-size:14px;line-height:1.6}
.sched li{display:grid;grid-template-columns:86px minmax(0,1fr);gap:8px}
.sched b{font-variant-numeric:tabular-nums}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.gm{display:inline-block;font-size:14px;font-weight:600;color:var(--btnink);background:var(--btn);text-decoration:none;padding:10px 14px;border-radius:10px}
.gm:focus-visible,summary:focus-visible,.pl a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.pltitle{font-size:12px;font-weight:600;color:var(--muted);margin-top:4px}
.places{display:flex;flex-direction:column;gap:6px}
details.pl{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--soft)}
details.pl summary{cursor:pointer;list-style:none;display:flex;align-items:center;gap:6px;flex-wrap:wrap;min-height:28px}
details.pl summary::-webkit-details-marker{display:none}
details.pl summary::before{content:"▸";color:var(--muted)}
details.pl[open] summary::before{content:"▾"}
.pn{font-weight:600;font-size:14px}
.tag{font-size:11px;font-weight:600;padding:1px 8px;border-radius:999px;background:var(--tagbg);color:var(--tagink)}
details.pl ul{margin:8px 0 6px;padding-left:18px;font-size:13.5px;line-height:1.6}
.pl a{font-size:13.5px;font-weight:600;color:var(--btn)}
.note{font-size:12.5px;color:var(--muted);line-height:1.6}
@media print{body{background:#fff;color:#1B2A3A;font-size:12px}.bar,.msg,.gm,.pltitle{display:none!important}.day{break-inside:avoid;border-color:#ccc}details.pl{background:#fff}details.pl summary::before{content:""}.pl .row{display:none}.wrap{max-width:none;padding:0}}

.gate{min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:24px 16px;box-sizing:border-box}
.gbox{width:100%;max-width:360px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:28px 22px;display:flex;flex-direction:column;gap:14px;box-sizing:border-box}
.gbox .eyebrow{text-align:center}
.gbox h2{margin:0;font-family:var(--display);font-size:26px;text-align:center;line-height:1.2}
.gbox p{margin:0;font-size:14px;color:var(--muted);text-align:center}
.gbox input{font:inherit;font-size:16px;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--soft);color:var(--ink);width:100%;box-sizing:border-box}
.gbox input:focus{outline:2px solid var(--btn);outline-offset:1px}
.gbox button{font:inherit;font-size:15px;font-weight:600;padding:12px;border:0;border-radius:10px;background:var(--btn);color:var(--btnink);cursor:pointer}
.gbox button:disabled{opacity:.6}
.gerr{font-size:13px;color:#C0392B;text-align:center;min-height:18px}
.gshow{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted)}
.gshow input{width:auto}
#app[hidden],.gate[hidden]{display:none}
.lock{font-size:12.5px;font-weight:600;border:1px solid var(--line);background:var(--card);color:var(--muted);border-radius:999px;padding:9px 14px;cursor:pointer;font-family:inherit}
@media print{.gate,.lock{display:none!important}}
</style>
</head><body>

function ub(s){var b=atob(s),u=new Uint8Array(b.length);for(var i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u}
async function unlock(pw){
  var k=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  var key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:ub(DATA.s),iterations:DATA.n,hash:'SHA-256'},k,{name:'AES-GCM',length:256},false,['decrypt']);
  var pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:ub(DATA.i)},key,ub(DATA.c));
  return new TextDecoder().decode(pt);
}
function initApp(){
  var L=document.getElementById('lang');
  function setLang(){document.documentElement.lang=L.checked?'en':'th';try{localStorage.setItem('lang',L.checked?'en':'th')}catch(e){}}
  try{if(localStorage.getItem('lang')==='en')L.checked=true}catch(e){}
  setLang();L.addEventListener('change',setLang);
  var bar=document.querySelector('.bar'),lk=document.createElement('button');
  lk.type='button';lk.className='lock';lk.textContent='🔒';lk.title='Lock';lk.setAttribute('aria-label','Lock');
  lk.onclick=function(){try{sessionStorage.removeItem('jp_pw')}catch(e){}location.reload()};bar.appendChild(lk);
  document.getElementById('pdf').addEventListener('click',function(){var d=document.querySelectorAll('details.pl'),s=[];d.forEach(function(x){s.push(x.open);x.open=true});window.print();d.forEach(function(x,i){x.open=s[i]})});
  window.addEventListener('beforeprint',function(){document.querySelectorAll('details.pl').forEach(function(x){x.open=true})});
}
async function tryPw(pw,quiet){
  var E=document.getElementById('ge'),G=document.getElementById('go');
  if(!window.crypto||!crypto.subtle){E.textContent='เบราว์เซอร์นี้ไม่รองรับ (ต้องเปิดผ่าน https) / Browser not supported';return}
  G.disabled=true;E.textContent='';
  try{var html=await unlock(pw);var A=document.getElementById('app');A.innerHTML=html;A.hidden=false;document.getElementById('gate').hidden=true;
    try{sessionStorage.setItem('jp_pw',pw)}catch(e){}initApp();}
  catch(e){if(!quiet){E.textContent='รหัสไม่ถูกต้อง / Wrong password';document.getElementById('pw').select()}}
  G.disabled=false;
}
document.getElementById('gf').addEventListener('submit',function(e){e.preventDefault();tryPw(document.getElementById('pw').value.trim())});
document.getElementById('sh').addEventListener('change',function(){document.getElementById('pw').type=this.checked?'text':'password'});
try{var s=sessionStorage.getItem('jp_pw');if(s)tryPw(s,true)}catch(e){}
</script>
