<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>RJ Japan Trip</title><meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#1F6FB2"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="apple-touch-icon.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="JP Trip"><meta name="apple-mobile-web-app-status-bar-style" content="default"><script>try{var t=localStorage.getItem('theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t)}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bai+Jamjuree:wght@600;700&family=Noto+Sans+Thai:wght@400;500;600&display=swap">
<style>
:root{--bg:#EEF2F5;--card:#FFFFFF;--soft:#F6F8FA;--ink:#1B2A3A;--muted:#5A6B7B;--line:#D9E0E6;--accent:#C2511F;--btn:#1F6FB2;--btnink:#FFFFFF;--tagbg:#E3EBF3;--tagink:#1F4B75;
--display:"Bai Jamjuree","Noto Sans Thai",system-ui,sans-serif;--body:"Noto Sans Thai",system-ui,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#11171E;--card:#18212B;--soft:#1E2934;--ink:#E6ECF2;--muted:#9AA9B8;--line:#2B3845;--accent:#F08A5D;--btn:#3B8BD4;--btnink:#FFFFFF;--tagbg:#22374D;--tagink:#BFD7EE;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#11171E;--card:#18212B;--soft:#1E2934;--ink:#E6ECF2;--muted:#9AA9B8;--line:#2B3845;--accent:#F08A5D;--btn:#3B8BD4;--btnink:#FFFFFF;--tagbg:#22374D;--tagink:#BFD7EE;color-scheme:dark}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px}
.en{display:none}
#lang:checked ~ .wrap .th{display:none}
#lang:checked ~ .wrap .en{display:inline}
.lt{position:absolute;opacity:0;pointer-events:none}
.wrap{max-width:720px;margin:0 auto;padding-block:20px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:16px}
.bar{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.sw2{display:inline-flex;border:1px solid var(--line);border-radius:999px;background:var(--card);padding:3px;cursor:pointer;user-select:none;font-size:13px;font-weight:600}
.sw2 span{display:inline-block;padding:6px 12px;border-radius:999px;color:var(--muted)}
.sw2 .o1{background:var(--ink);color:var(--bg)}
#lang:checked ~ .wrap .sw2 .o1{background:none;color:var(--muted)}
#lang:checked ~ .wrap .sw2 .o2{background:var(--ink);color:var(--bg)}
#lang:focus-visible ~ .wrap .sw2{outline:2px solid var(--accent);outline-offset:2px}
.pdf{font:inherit;font-size:13px;font-weight:600;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:9px 14px;cursor:pointer}
.pdf:hover{border-color:var(--btn)}
.pdf:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.pdf[hidden]{display:none}
.msg{font-size:12.5px;color:var(--muted);text-align:right;min-height:0}
.eyebrow{font-size:13px;font-weight:600;letter-spacing:.08em;color:var(--accent)}
h1{margin:0;font-family:var(--display);font-size:clamp(30px,7vw,44px);line-height:1.1;text-wrap:balance}
.sub{font-size:14px;color:var(--muted)}
.flights{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.fl{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:4px;font-size:14px}
.fl b{font-family:var(--display);font-variant-numeric:tabular-nums}
.fl .h{font-size:12px;font-weight:600;letter-spacing:.08em;color:var(--accent)}
#days{display:flex;flex-direction:column;gap:14px}
.day{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px;display:flex;flex-direction:column;gap:8px;min-width:0}
.dh{display:flex;align-items:center;gap:8px;font-weight:600;font-size:14px;color:var(--muted)}
.sw{width:12px;height:12px;border-radius:3px;flex:none}
.dt{font-family:var(--display);font-weight:700;font-size:22px;line-height:1.2}
.sched{margin:0;padding:0;list-style:none;font-size:14px;line-height:1.6}
.sched li{display:grid;grid-template-columns:86px minmax(0,1fr);gap:8px}
.sched b{font-variant-numeric:tabular-nums}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.gm{display:inline-block;font-size:14px;font-weight:600;color:var(--btnink);background:var(--btn);text-decoration:none;padding:10px 14px;border-radius:10px}
.gm:focus-visible,summary:focus-visible,.pl a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.pltitle{font-size:12px;font-weight:600;color:var(--muted);margin-top:4px}
.places{display:flex;flex-direction:column;gap:6px}
details.pl{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--soft)}
details.pl summary{cursor:pointer;list-style:none;display:flex;align-items:center;gap:6px;flex-wrap:wrap;min-height:28px}
details.pl summary::-webkit-details-marker{display:none}
details.pl summary::before{content:"▸";color:var(--muted)}
details.pl[open] summary::before{content:"▾"}
.pn{font-weight:600;font-size:14px}
.tag{font-size:11px;font-weight:600;padding:1px 8px;border-radius:999px;background:var(--tagbg);color:var(--tagink)}
details.pl ul{margin:8px 0 6px;padding-left:18px;font-size:13.5px;line-height:1.6}
.pl a{font-size:13.5px;font-weight:600;color:var(--btn)}
.note{font-size:12.5px;color:var(--muted);line-height:1.6}
@media print{body{background:#fff;color:#1B2A3A;font-size:12px}.bar,.msg,.pltitle{display:none!important}.day{break-inside:avoid;border-color:#ccc}details.pl{background:#fff}details.pl summary::before{content:""}.pl .row{display:flex!important;margin-top:2px}.wrap{max-width:none;padding:0}}

.gate{min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:24px 16px;box-sizing:border-box}
.gbox{width:100%;max-width:360px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:28px 22px;display:flex;flex-direction:column;gap:14px;box-sizing:border-box}
.gbox .eyebrow{text-align:center}
.gbox h2{margin:0;font-family:var(--display);font-size:26px;text-align:center;line-height:1.2}
.gbox p{margin:0;font-size:14px;color:var(--muted);text-align:center}
.gbox input{font:inherit;font-size:16px;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--soft);color:var(--ink);width:100%;box-sizing:border-box}
.gbox input:focus{outline:2px solid var(--btn);outline-offset:1px}
.gbox button{font:inherit;font-size:15px;font-weight:600;padding:12px;border:0;border-radius:10px;background:var(--btn);color:var(--btnink);cursor:pointer}
.gbox button:disabled{opacity:.6}
.gerr{font-size:13px;color:#C0392B;text-align:center;min-height:18px}
.gshow{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted)}
.gshow input{width:auto}
#app[hidden],.gate[hidden]{display:none}
.lock{font-size:12.5px;font-weight:600;border:1px solid var(--line);background:var(--card);color:var(--muted);border-radius:999px;padding:9px 14px;cursor:pointer;font-family:inherit}
@media print{.gate,.lock{display:none!important}}


:root[data-theme="dark"] .fl,:root[data-theme="dark"] .day,:root[data-theme="dark"] .gbox,:root[data-theme="dark"] .status{border-color:var(--line)}
.thm{font-size:16px;line-height:1;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:9px 12px;min-height:38px;cursor:pointer;font-family:inherit}
.thm:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.gbox .thm{align-self:center;font-size:13px;font-weight:600;color:var(--muted)}
@media print{.thm{display:none!important}}


:root{--pa1:#FFC4D6;--pa2:#FFDDB0;--pa3:#BDEFD6;--pa4:#C4D5FF;--pa5:#DEC8FF;--glass:rgba(255,255,255,.7);--navbg:rgba(255,255,255,.62)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--pa1:#3A2433;--pa2:#3A3024;--pa3:#1F3A30;--pa4:#22304A;--pa5:#30264A;--glass:rgba(24,33,43,.82);--navbg:rgba(17,23,30,.6)}}
:root[data-theme="dark"]{--pa1:#3A2433;--pa2:#3A3024;--pa3:#1F3A30;--pa4:#22304A;--pa5:#30264A;--glass:rgba(24,33,43,.82);--navbg:rgba(17,23,30,.6)}
body{min-height:100vh;background-color:var(--bg);background-image:radial-gradient(60vmax 50vmax at 0% 0%,var(--pa1),transparent 60%),radial-gradient(55vmax 45vmax at 100% 8%,var(--pa4),transparent 60%),radial-gradient(60vmax 50vmax at 15% 55%,var(--pa3),transparent 60%),radial-gradient(55vmax 50vmax at 95% 60%,var(--pa5),transparent 60%),radial-gradient(60vmax 45vmax at 40% 100%,var(--pa2),transparent 60%),linear-gradient(160deg,var(--pa1),var(--pa4) 35%,var(--pa3) 65%,var(--pa2));background-attachment:fixed}
.fl,.day,.gbox,.status{background:var(--glass);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);border-color:rgba(255,255,255,.55);box-shadow:0 6px 24px rgba(120,100,160,.10)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .fl,:root:not([data-theme="light"]) .day,:root:not([data-theme="light"]) .gbox,:root:not([data-theme="light"]) .status{border-color:var(--line)}}
.pl a.web{display:inline-block;text-decoration:none;font-size:13px;font-weight:600;color:var(--tagink);background:var(--tagbg);padding:7px 12px;border-radius:999px}
.pl a.web:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media print{body{background:#fff!important}.fl,.day{box-shadow:none;background:#fff}}

html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
.dnav{position:sticky;top:0;z-index:20;margin:0 -16px;padding:10px 16px;background:var(--navbg);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}
.dnav::-webkit-scrollbar{display:none}
.dnav a{flex:none;display:flex;flex-direction:column;align-items:center;min-width:52px;padding:6px 10px;border-radius:12px;border:1px solid var(--line);background:var(--glass);color:var(--ink);text-decoration:none;font-size:12px;line-height:1.25;font-weight:600}
.dnav a i{font-style:normal;font-family:var(--display);font-size:17px;font-variant-numeric:tabular-nums}
.dnav a s{text-decoration:none;width:18px;height:3px;border-radius:2px;margin-top:3px}
.dnav a.past{opacity:.55}
.dnav a.now{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.dnav a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.day{scroll-margin-top:84px}
.day.today{border:2px solid var(--accent);box-shadow:0 4px 18px color-mix(in srgb,var(--accent) 18%,transparent)}
.day.past .dt,.day.past .sched{opacity:.6}
.badge{margin-left:auto;font-size:11px;font-weight:700;letter-spacing:.06em;color:#fff;background:var(--accent);padding:3px 9px;border-radius:999px}
.badge.done{background:var(--line);color:var(--muted)}
.status{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:13px;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 14px}
.status:empty{display:none}
.status .dot{width:8px;height:8px;border-radius:50%;background:#2E7D4F;flex:none}
.status .dot.off{background:#C0392B}
.status button{margin-left:auto;font:inherit;font-size:13px;font-weight:600;border:0;border-radius:999px;padding:7px 12px;background:var(--btn);color:var(--btnink);cursor:pointer}
.gm{padding:12px 16px;min-height:44px;box-sizing:border-box}
details.pl summary{min-height:36px}
.pdf,.lock,.sw2{min-height:38px;box-sizing:border-box}
.gshow+.gshow{margin-top:-6px}
@media (max-width:480px){.gm{display:block;text-align:center;width:100%}.sched li{grid-template-columns:72px minmax(0,1fr)}.dt{font-size:20px}.day{padding:14px 14px}}

details.pl{padding:0;background:var(--card);border:1.5px solid var(--line);border-radius:14px;box-shadow:0 2px 0 rgba(31,111,178,.10),0 3px 10px rgba(120,100,160,.08);transition:border-color .15s,box-shadow .15s,transform .1s;overflow:hidden}
details.pl summary{padding:12px 12px 12px 14px;gap:8px;min-height:48px;-webkit-tap-highlight-color:transparent;user-select:none}
details.pl summary::before{content:none!important}
details.pl summary .pn{flex:1 1 auto;min-width:0}
details.pl summary .more{margin-left:auto;flex:none;display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--btn);white-space:nowrap}
details.pl summary .chev{width:28px;height:28px;border-radius:50%;background:var(--btn);color:#fff;display:inline-flex;align-items:center;justify-content:center;transition:transform .2s}
details.pl summary .chev svg{width:14px;height:14px}
details.pl[open] summary .chev{transform:rotate(180deg)}
details.pl[open] summary .more .t1,details.pl:not([open]) summary .more .t2{display:none}
details.pl:hover{border-color:var(--btn)}
details.pl summary:active{background:var(--soft)}
details.pl[open]{border-color:var(--btn);box-shadow:0 4px 16px rgba(31,111,178,.15)}
details.pl[open] summary{border-bottom:1px dashed var(--line);background:var(--soft)}
details.pl>ul{margin:10px 14px 8px;padding-left:18px}
details.pl>.row{padding:0 14px 12px}
.pltitle::before{content:"👇 "}

details.pl summary{display:grid!important;grid-template-columns:minmax(0,1fr) auto;column-gap:10px;row-gap:5px;align-items:center}
details.pl summary .pn{grid-column:1;grid-row:1;font-size:14.5px;line-height:1.35}
details.pl summary .tag{grid-column:1;grid-row:2;justify-self:start}
details.pl summary .more{grid-column:2;grid-row:1/span 2;margin-left:0}
details.pl .row{gap:8px}
details.pl .row a:not(.web){display:inline-block;text-decoration:none;font-size:13px;font-weight:600;color:var(--btnink);background:var(--btn);padding:7px 12px;border-radius:999px}
@media (max-width:380px){details.pl summary .more .lbl{display:none}}
@media print{details.pl summary .more{display:none}details.pl{box-shadow:none}}
@media print{.dnav,.status,.badge{display:none!important}.day.past .dt,.day.past .sched{opacity:1}.day.today{border:1px solid #ccc;box-shadow:none}}
@media print{.gm{display:inline-block!important;background:#fff!important;color:#1F6FB2!important;border:1px solid #1F6FB2!important;box-shadow:none!important;padding:4px 10px!important;font-size:11px!important;text-decoration:none}.pl .row a,.gm{background:#fff!important;background-image:none!important;border:1px solid #1F6FB2!important;box-shadow:none!important;padding:3px 10px!important;border-radius:999px!important;font-size:11px!important;text-decoration:none!important}.pl .row a,.pl .row a *,.gm,.gm *{color:#1F6FB2!important;-webkit-text-fill-color:#1F6FB2!important}a[href]{-webkit-print-color-adjust:exact;print-color-adjust:exact}}

.wx{border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--soft);display:flex;flex-direction:column;gap:6px;font-size:13.5px}
.wx .wh{font-size:12px;font-weight:600;color:var(--muted);display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.wx .wr{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:8px;align-items:center}
.wx .wi{font-size:22px;line-height:1;text-align:center}
.wx .wn{font-weight:600}
.wx .wn small{font-weight:500;color:var(--muted);font-size:11.5px}
.wx .wd{color:var(--muted);font-size:12.5px}
.wx .wt{font-family:var(--display);font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.wx .wt .lo{color:#3B82C4}.wx .wt .hi{color:#D2603A}
.wx .hrs{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:4px;margin-top:2px}
.wx .hrs div{text-align:center;font-size:11.5px;color:var(--muted);background:var(--card);border-radius:8px;padding:4px 0;font-variant-numeric:tabular-nums}
.wx .hrs b{display:block;font-size:13px;color:var(--ink)}
.wx .wnote{font-size:11.5px;color:var(--muted)}
.wx.load{color:var(--muted);font-size:12.5px}
.pwx{font-size:12.5px;color:var(--muted);margin:2px 0 4px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.pwx b{color:var(--ink);font-variant-numeric:tabular-nums}
.wxsrc{font-size:12px;color:var(--muted);line-height:1.6}
.wxsrc a,.wx .wh a{color:var(--btn)}
@media print{.wx{background:#fff;break-inside:avoid}.wx .hrs div{background:#F3F5F8}}
</style>
</head><body>
<div class="gate" id="gate"><form class="gbox" id="gf" autocomplete="off">
<div class="eyebrow">22–29 OCT 2026 · JAPAN</div>
<h2>🔒 RJ Japan Trip</h2>
<p>ใส่รหัสผ่านเพื่อดูแผนเที่ยว<br>Enter the password to view the plan</p>
<input type="password" id="pw" placeholder="Password" aria-label="Password" autocapitalize="none" autocorrect="off" spellcheck="false" required>
<label class="gshow"><input type="checkbox" id="sh"> แสดงรหัส / Show</label>
<label class="gshow"><input type="checkbox" id="rm" checked> จำรหัสในเครื่องนี้ / Remember on this device</label>
<button type="submit" id="go">เข้าดู / Open</button>
<div class="gerr" id="ge" aria-live="polite"></div>
<button type="button" class="thm" id="thmGate"></button></form></div>

    keys.forEach(function(k,n){var L=cfg.loc[k],x=data&&wxDay(data.d[k],date);if(!x)return;var c=wxc(x.c);
      rows+='<div class="wr"><span class="wi">'+c[0]+'</span><span><span class="wn">'+L[3]+' <small>'+L[2].toLocaleString()+' m</small></span><br><span class="wd">'+bi(c[1],c[2])+' · '+bi('ฝน ','Rain ')+r0(x.p)+'% · '+bi('ลม ','Wind ')+r0(x.w)+' km/h</span></span><span class="wt"><span class="lo">'+r0(x.lo)+'°</span> / <span class="hi">'+r0(x.hi)+'°</span></span></div>';
      if(n===0)hrs=wxHrs(data.d[k],date)});
    var head='<div class="wh"><span>🌤️ '+bi('พยากรณ์อากาศ','Weather forecast')+' (<a href="https://open-meteo.com/" target="_blank" rel="noopener">Open-Meteo.com</a>)</span><span>'+(data?bi('อัปเดต ','Updated ')+fmtT(data.t)+(stale?' · '+bi('ข้อมูลที่บันทึกไว้','saved copy'):''):'')+'</span></div>';
    if(rows){box.className='wx';box.innerHTML=head+rows+hrs}
    else{box.className='wx load';box.innerHTML=head+'<span class="wnote">'+(data?bi('ยังไม่มีพยากรณ์สำหรับวันนี้ (พยากรณ์ได้ล่วงหน้า ~16 วัน)','No forecast yet for this date (~16-day range)'):bi('โหลดพยากรณ์ไม่ได้ ต้องต่ออินเทอร์เน็ต','Could not load forecast — needs internet'))+'</span>'}
    sec.querySelectorAll('details.pl').forEach(function(dt){
      var nm=(dt.querySelector('.pn')||{}).textContent||'',k=null;Object.keys(cfg.pn).some(function(p){if(nm.indexOf(p)===0){k=cfg.pn[p];return true}});
      var old=dt.querySelector('.pwx');if(old)old.remove();if(!k||!data)return;var x=wxDay(data.d[k],date);if(!x)return;var c=wxc(x.c);
      var ul=dt.querySelector('ul');if(!ul)return;
      ul.insertAdjacentHTML('beforebegin','<div class="pwx">'+c[0]+' <b>'+r0(x.lo)+'–'+r0(x.hi)+'°C</b> · '+bi(c[1],c[2])+' · '+bi('ฝน ','Rain ')+r0(x.p)+'% · '+bi('ลม ','Wind ')+r0(x.w)+' km/h <span>('+cfg.loc[k][2].toLocaleString()+' m)</span></div>');
    });
  });
}
function initWx(secs){
  var el=document.getElementById('wxcfg');if(!el)return;var cfg;try{cfg=JSON.parse(el.textContent)}catch(e){return}
  secs.forEach(function(sec){var s=sec.querySelector('.sched');if(!s||sec.querySelector('.wx'))return;var b=document.createElement('div');b.className='wx load';b.innerHTML=bi('กำลังโหลดพยากรณ์อากาศ','Loading forecast')+' (Open-Meteo.com)…';s.insertAdjacentElement('afterend',b)});
  var note=document.querySelector('.note');
  if(note&&!document.querySelector('.wxsrc'))note.insertAdjacentHTML('afterend','<div class="wxsrc">🌤️ '+bi('แหล่งข้อมูลพยากรณ์อากาศ: ','Weather source: ')+'<a href="https://open-meteo.com/" target="_blank" rel="noopener">Open-Meteo.com</a> '+bi('(ข้อมูลฟรี สัญญาอนุญาต CC BY 4.0) ซึ่งรวมโมเดลพยากรณ์ของหน่วยงานอุตุนิยมวิทยาหลายแห่ง เช่น JMA กรมอุตุนิยมวิทยาญี่ปุ่น และ ECMWF ศูนย์พยากรณ์อากาศยุโรป · คำนวณตามพิกัดและความสูงของแต่ละจุด · ดึงข้อมูลใหม่ทุกครั้งที่เปิดหน้า','(free data, CC BY 4.0), which blends forecast models from national weather services such as JMA (Japan Meteorological Agency) and ECMWF · adjusted to each spot\'s coordinates and elevation · refreshed every time the page opens')+'</div>');
  var cached=null;try{cached=JSON.parse(localStorage.getItem(WXKEY)||'null')}catch(e){}
  if(cached)paintWx(cfg,cached,secs,true);
  loadWx(cfg).then(function(d){paintWx(cfg,d,secs,false)}).catch(function(){if(!cached)paintWx(cfg,null,secs,true)});
}
function initApp(){
  var L=document.getElementById('lang');
  function setLang(){document.documentElement.lang=L.checked?'en':'th';try{localStorage.setItem('lang',L.checked?'en':'th')}catch(e){}}
  try{if(localStorage.getItem('lang')==='en')L.checked=true}catch(e){}
  setLang();L.addEventListener('change',setLang);
  var bar=document.querySelector('.bar'),lk=document.createElement('button');
  lk.type='button';lk.className='lock';lk.textContent='🔒';lk.title='Lock';lk.setAttribute('aria-label','Lock');
  lk.onclick=function(){try{sessionStorage.removeItem('jp_pw');localStorage.removeItem('jp_pw')}catch(e){}location.reload()};bar.appendChild(lk);
  var tb=document.createElement('button');tb.type='button';tb.className='thm';tb.onclick=toggleTheme;bar.insertBefore(tb,lk);paintTheme();
  document.getElementById('pdf').addEventListener('click',function(){var d=document.querySelectorAll('details.pl'),s=[];d.forEach(function(x){s.push(x.open);x.open=true});window.print();d.forEach(function(x,i){x.open=s[i]})});
  window.addEventListener('beforeprint',function(){document.querySelectorAll('details.pl').forEach(function(x){x.open=true})});


  var chev='<span class="chev" aria-hidden="true"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 6l4.5 4.5L12.5 6"/></svg></span>';
  document.querySelectorAll('details.pl>summary').forEach(function(sm){sm.insertAdjacentHTML('beforeend','<span class="more"><span class="lbl"><span class="t1">'+bi('ดูรายละเอียด','Details')+'</span><span class="t2">'+bi('ซ่อน','Hide')+'</span></span>'+chev+'</span>')});
  // day navigation + today
  var today=jpToday(),secs=[].slice.call(document.querySelectorAll('#days .day')),nav=document.createElement('nav'),todaySec=null;
  nav.className='dnav';nav.setAttribute('aria-label','Days');
  secs.forEach(function(sec,i){
    var date=addDays(START,i),dd=+date.slice(8),sw=sec.querySelector('.sw'),col=sw?sw.style.background:'var(--muted)';
    sec.id='day'+(i+1);sec.dataset.date=date;
    var a=document.createElement('a');a.href='#day'+(i+1);
    a.innerHTML=bi('วัน '+(i+1),'Day '+(i+1))+'<i>'+dd+'</i><s style="background:'+col+'"></s>';
    a.setAttribute('aria-label','Day '+(i+1)+' · '+dd+' Oct');
    var dh=sec.querySelector('.dh');
    if(date===today){sec.classList.add('today');a.classList.add('now');a.setAttribute('aria-current','date');todaySec=sec;
      dh.insertAdjacentHTML('beforeend','<span class="badge">'+bi('วันนี้','TODAY')+'</span>')}
    else if(date<today){sec.classList.add('past');a.classList.add('past');
      dh.insertAdjacentHTML('beforeend','<span class="badge done">'+bi('ผ่านแล้ว','DONE')+'</span>')}
    nav.appendChild(a);
  });
  var days=document.getElementById('days');days.parentNode.insertBefore(nav,days);

  // status line
  var st=document.createElement('div');st.className='status';st.setAttribute('aria-live','polite');
  nav.parentNode.insertBefore(st,nav);
  function paint(){
    var on=navigator.onLine,h='<span class="dot'+(on?'':' off')+'"></span>';
    if(today<DEPART){var n=dayDiff(today,DEPART);h+=bi('อีก '+n+' วันออกเดินทาง','Departure in '+n+' day'+(n>1?'s':''))}
    else if(today===DEPART){h+=bi('วันนี้ออกเดินทาง · VN614 15:55 ✈️','Departure today · VN614 15:55 ✈️')}
    else if(todaySec){var i=secs.indexOf(todaySec)+1;h+=bi('วันที่ '+i+' จาก '+secs.length+' · '+todaySec.querySelector('.dt').textContent,'Day '+i+' of '+secs.length+' · '+todaySec.querySelector('.dt').textContent)+'<button type="button" id="goToday">'+bi('ไปวันนี้','Go to today')+'</button>'}
    else if(today>END){h+=bi('จบทริปแล้ว 🙏','Trip finished 🙏')}
    if(!on)h+=' · '+bi('ออฟไลน์ ใช้ข้อมูลที่บันทึกไว้','Offline · using saved copy');
    st.innerHTML=h;
    var g=document.getElementById('goToday');if(g)g.onclick=function(){todaySec.scrollIntoView({behavior:'smooth',block:'start'})};
  }
  paint();window.addEventListener('online',paint);window.addEventListener('offline',paint);
  if(todaySec&&!location.hash)setTimeout(function(){todaySec.scrollIntoView({block:'start'})},60);

  // keep active chip in view
  var chips=[].slice.call(nav.querySelectorAll('a'));
  if('IntersectionObserver' in window){
    var io=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){var c=chips[secs.indexOf(e.target)];chips.forEach(function(x){x.style.outline=''});c.style.outline='2px solid var(--btn)';c.scrollIntoView({block:'nearest',inline:'center'})}})},{rootMargin:'-40% 0px -55% 0px'});
    secs.forEach(function(s){io.observe(s)});
  }
  initWx(secs);
}
async function tryPw(pw,quiet){
  var E=document.getElementById('ge'),G=document.getElementById('go');
  if(!window.crypto||!crypto.subtle){E.textContent='เบราว์เซอร์นี้ไม่รองรับ (ต้องเปิดผ่าน https) / Browser not supported';return}
  G.disabled=true;E.textContent='';
  try{var html=await unlock(pw);var A=document.getElementById('app');A.innerHTML=html;A.hidden=false;document.getElementById('gate').hidden=true;
    try{sessionStorage.setItem('jp_pw',pw);var rm=document.getElementById('rm');if(quiet==='local'||(rm&&rm.checked))localStorage.setItem('jp_pw',pw);}catch(e){}initApp();}
  catch(e){if(quiet==='local'){try{localStorage.removeItem('jp_pw')}catch(x){}}if(!quiet){E.textContent='รหัสไม่ถูกต้อง / Wrong password';document.getElementById('pw').select()}}
  G.disabled=false;
}
document.getElementById('thmGate').onclick=toggleTheme;paintTheme();
if(window.matchMedia){try{matchMedia('(prefers-color-scheme: dark)').addEventListener('change',paintTheme)}catch(e){}}
document.getElementById('gf').addEventListener('submit',function(e){e.preventDefault();tryPw(document.getElementById('pw').value.trim())});
document.getElementById('sh').addEventListener('change',function(){document.getElementById('pw').type=this.checked?'text':'password'});
try{var s=sessionStorage.getItem('jp_pw'),l=localStorage.getItem('jp_pw');if(s)tryPw(s,true);else if(l)tryPw(l,'local')}catch(e){}
if('serviceWorker' in navigator&&window.isSecureContext){navigator.serviceWorker.register('sw.js').catch(function(){})}

</script>
