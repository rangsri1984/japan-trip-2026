function ub(s){var b=atob(s),u=new Uint8Array(b.length);for(var i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u}
async function unlock(pw){var e;for(var D of [DATA,DATA2]){try{return await unlock1(pw,D)}catch(x){e=x}}throw e}
async function unlock1(pw,DATA){
  var k=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  var key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:ub(DATA.s),iterations:DATA.n,hash:'SHA-256'},k,{name:'AES-GCM',length:256},false,['decrypt']);
  var pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:ub(DATA.i)},key,ub(DATA.c));
  return new TextDecoder().decode(pt);
}

function jpToday(){
  try{var q=new URLSearchParams(location.search).get('d');if(q&&/^\d{4}-\d{2}-\d{2}$/.test(q))return q}catch(e){}
  try{return new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Tokyo',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date())}catch(e){return new Date().toISOString().slice(0,10)}
}
function addDays(iso,n){var d=new Date(iso+'T00:00:00Z');d.setUTCDate(d.getUTCDate()+n);return d.toISOString().slice(0,10)}
function dayDiff(a,b){return Math.round((new Date(b+'T00:00:00Z')-new Date(a+'T00:00:00Z'))/864e5)}
function bi(th,en){return '<span class="th">'+th+'</span><span class="en">'+en+'</span>'}

// ===== Weather (Open-Meteo) =====
var WXC={0:['☀️','ฟ้าใส','Clear'],1:['🌤️','แดดเป็นส่วนใหญ่','Mostly clear'],2:['⛅','มีเมฆบางส่วน','Partly cloudy'],3:['☁️','เมฆมาก','Overcast'],45:['🌫️','หมอก','Fog'],48:['🌫️','หมอกน้ำแข็ง','Rime fog'],51:['🌦️','ฝนปรอยเบา','Light drizzle'],53:['🌦️','ฝนปรอย','Drizzle'],55:['🌧️','ฝนปรอยหนัก','Heavy drizzle'],56:['🌧️','ฝนปรอยเยือกแข็ง','Freezing drizzle'],57:['🌧️','ฝนปรอยเยือกแข็ง','Freezing drizzle'],61:['🌦️','ฝนเล็กน้อย','Light rain'],63:['🌧️','ฝนปานกลาง','Rain'],65:['🌧️','ฝนหนัก','Heavy rain'],66:['🌧️','ฝนเยือกแข็ง','Freezing rain'],67:['🌧️','ฝนเยือกแข็ง','Freezing rain'],71:['🌨️','หิมะเล็กน้อย','Light snow'],73:['🌨️','หิมะ','Snow'],75:['❄️','หิมะหนัก','Heavy snow'],77:['🌨️','เกล็ดหิมะ','Snow grains'],80:['🌦️','ฝนซู่','Showers'],81:['🌧️','ฝนซู่','Showers'],82:['⛈️','ฝนซู่หนัก','Heavy showers'],85:['🌨️','หิมะซู่','Snow showers'],86:['❄️','หิมะซู่หนัก','Heavy snow showers'],95:['⛈️','พายุฝนฟ้าคะนอง','Thunderstorm'],96:['⛈️','พายุลูกเห็บ','Thunderstorm, hail'],99:['⛈️','พายุลูกเห็บ','Thunderstorm, hail']};
function wxc(c){return WXC[c]||['🌡️','—','—']}
function r0(x){return x==null?'–':Math.round(x)}
var WXKEY='jp_wx_v1';
async function loadWx(cfg){
  var keys=Object.keys(cfg.loc),q=function(i){return keys.map(function(k){return cfg.loc[k][i]}).join(',')};
  var url='https://api.open-meteo.com/v1/forecast?latitude='+q(0)+'&longitude='+q(1)+'&elevation='+q(2)+
    '&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max,wind_speed_10m_max'+
    '&hourly=temperature_2m,weather_code,precipitation_probability&timezone=Asia%2FTokyo&start_date='+START+'&end_date='+END;
  var r=await fetch(url);if(!r.ok)throw new Error('HTTP '+r.status);
  var j=await r.json();if(!Array.isArray(j))j=[j];
  var out={t:Date.now(),d:{}};keys.forEach(function(k,i){out.d[k]=j[i]});
  try{localStorage.setItem(WXKEY,JSON.stringify(out))}catch(e){}
  return out;
}
function wxDay(w,date){var D=w&&w.daily;if(!D)return null;var i=D.time.indexOf(date);if(i<0||D.weather_code[i]==null)return null;
  return {c:D.weather_code[i],hi:D.temperature_2m_max[i],lo:D.temperature_2m_min[i],p:D.precipitation_probability_max[i],w:D.wind_speed_10m_max[i]}}
function wxHrs(w,date){var H=w&&w.hourly;if(!H)return '';var h='';[6,9,12,15,18,21].forEach(function(hr){var i=H.time.indexOf(date+'T'+(hr<10?'0':'')+hr+':00');if(i<0||H.temperature_2m[i]==null)return;
  h+='<div>'+(hr<10?'0':'')+hr+':00<b>'+wxc(H.weather_code[i])[0]+' '+r0(H.temperature_2m[i])+'°</b></div>'});return h?'<div class="hrs">'+h+'</div>':''}
function fmtT(t){try{return new Intl.DateTimeFormat('th-TH',{timeZone:'Asia/Bangkok',day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}).format(new Date(t))}catch(e){return new Date(t).toLocaleString()}}
function paintWx(cfg,data,secs,stale){
  secs.forEach(function(sec,i){
    var box=sec.querySelector('.wx');if(!box)return;var date=sec.dataset.date,keys=cfg.days[i]||[],rows='',hrs='';
    keys.forEach(function(k,n){var L=cfg.loc[k],x=data&&wxDay(data.d[k],date);if(!x)return;var c=wxc(x.c);
      rows+='<div class="wr"><span class="wi">'+c[0]+'</span><span><span class="wn">'+L[3]+' <small>'+L[2].toLocaleString()+' m</small></span><br><span class="wd">'+bi(c[1],c[2])+' · '+bi('ฝน ','Rain ')+r0(x.p)+'% · '+bi('ลม ','Wind ')+r0(x.w)+' km/h</span></span><span class="wt"><span class="lo">'+r0(x.lo)+'°</span> / <span class="hi">'+r0(x.hi)+'°</span></span></div>';
      if(n===0)hrs=wxHrs(data.d[k],date)});
    var head='<div class="wh"><span>🌤️ '+bi('พยากรณ์อากาศ','Weather forecast')+' (<a href="https://open-meteo.com/" target="_blank" rel="noopener">Open-Meteo.com</a>)</span><span>'+(data?bi('อัปเดต ','Updated ')+fmtT(data.t)+(stale?' · '+bi('ข้อมูลที่บันทึกไว้','saved copy'):''):'')+'</span></div>';
    if(rows){box.className='wx';box.innerHTML=head+rows+hrs}
    else{box.className='wx load';box.innerHTML=head+'<span class="wnote">'+(data?bi('ยังไม่มีพยากรณ์สำหรับวันนี้ (พยากรณ์ได้ล่วงหน้า ~16 วัน)','No forecast yet for this date (~16-day range)'):bi('โหลดพยากรณ์ไม่ได้ ต้องต่ออินเทอร์เน็ต','Could not load forecast — needs internet'))+'</span>'}
    sec.querySelectorAll('details.pl').forEach(function(dt){
      var nm=(dt.querySelector('.pn')||{}).textContent||'',k=null;Object.keys(cfg.pn).some(function(p){if(nm.indexOf(p)===0){k=cfg.pn[p];return true}});
      var old=dt.querySelector('.pwx');if(old)old.remove();if(!k||!data)return;var x=wxDay(data.d[k],date);if(!x)return;var c=wxc(x.c);
      var ul=dt.querySelector('ul');if(!ul)return;
      ul.insertAdjacentHTML('beforebegin','<div class="pwx">'+c[0]+' <b>'+r0(x.lo)+'–'+r0(x.hi)+'°C</b> · '+bi(c[1],c[2])+' · '+bi('ฝน ','Rain ')+r0(x.p)+'% · '+bi('ลม ','Wind ')+r0(x.w)+' km/h <span>('+cfg.loc[k][2].toLocaleString()+' m)</span></div>');
    });
  });
}
function initWx(secs){
  var el=document.getElementById('wxcfg');if(!el)return;var cfg;try{cfg=JSON.parse(el.textContent)}catch(e){return}
  secs.forEach(function(sec){var s=sec.querySelector('.sched');if(!s||sec.querySelector('.wx'))return;var b=document.createElement('div');b.className='wx load';b.innerHTML=bi('กำลังโหลดพยากรณ์อากาศ','Loading forecast')+' (Open-Meteo.com)…';s.insertAdjacentElement('afterend',b)});
  var note=document.querySelector('.note');
  if(note&&!document.querySelector('.wxsrc'))note.insertAdjacentHTML('afterend','<div class="wxsrc">🌤️ '+bi('แหล่งข้อมูลพยากรณ์อากาศ: ','Weather source: ')+'<a href="https://open-meteo.com/" target="_blank" rel="noopener">Open-Meteo.com</a> '+bi('(ข้อมูลฟรี สัญญาอนุญาต CC BY 4.0) ซึ่งรวมโมเดลพยากรณ์ของหน่วยงานอุตุนิยมวิทยาหลายแห่ง เช่น JMA กรมอุตุนิยมวิทยาญี่ปุ่น และ ECMWF ศูนย์พยากรณ์อากาศยุโรป · คำนวณตามพิกัดและความสูงของแต่ละจุด · ดึงข้อมูลใหม่ทุกครั้งที่เปิดหน้า','(free data, CC BY 4.0), which blends forecast models from national weather services such as JMA (Japan Meteorological Agency) and ECMWF · adjusted to each spot\'s coordinates and elevation · refreshed every time the page opens')+'</div>');
  var cached=null;try{cached=JSON.parse(localStorage.getItem(WXKEY)||'null')}catch(e){}
  if(cached)paintWx(cfg,cached,secs,true);
  loadWx(cfg).then(function(d){paintWx(cfg,d,secs,false)}).catch(function(){if(!cached)paintWx(cfg,null,secs,true)});
}

var ACT_PLAN=[['land','key','car'],['gondola','cafe','home'],['car','bus','hike','tent'],['bus','leaf','fuji','bed'],['shop','car','train'],['car','fuel','takeoff','takeoff']];
function aicHtml(k){var a=ACT_ICONS[k];return '<span class="aic '+a[0]+'" role="img" aria-label="'+a[3]+'" title="'+a[3]+'"><svg viewBox="0 0 24 24">'+a[1]+'</svg></span>'}
function initIcons(secs){
  secs.forEach(function(sec,i){var plan=ACT_PLAN[i]||[];sec.querySelectorAll('.sched > li').forEach(function(li,j){var k=plan[j];if(!k||!ACT_ICONS[k]||li.classList.contains('ai'))return;
    var b=li.querySelector('b');if(!b)return;li.classList.add('ai');b.insertAdjacentHTML('afterend',aicHtml(k))})});
}
function initApp(){
  var L=document.getElementById('lang');
  function setLang(){document.documentElement.lang=L.checked?'en':'th';try{localStorage.setItem('lang',L.checked?'en':'th')}catch(e){}}
  try{if(localStorage.getItem('lang')==='en')L.checked=true}catch(e){}
  setLang();L.addEventListener('change',setLang);
  var bar=document.querySelector('.bar'),lk=document.createElement('button');
  lk.type='button';lk.className='lock';lk.textContent='🔒';lk.title='Lock';lk.setAttribute('aria-label','Lock');
  lk.onclick=function(){try{sessionStorage.removeItem('jp_pw');localStorage.removeItem('jp_pw')}catch(e){}location.reload()};bar.appendChild(lk);
  var tb=document.createElement('button');tb.type='button';tb.className='thm';tb.onclick=toggleTheme;bar.insertBefore(tb,lk);paintTheme();
  document.getElementById('pdf').addEventListener('click',function(){var d=document.querySelectorAll('details.pl'),s=[];d.forEach(function(x){s.push(x.open);x.open=true});window.print();d.forEach(function(x,i){x.open=s[i]})});
  window.addEventListener('beforeprint',function(){document.querySelectorAll('details.pl').forEach(function(x){x.open=true})});


  var chev='<span class="chev" aria-hidden="true"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 6l4.5 4.5L12.5 6"/></svg></span>';
  document.querySelectorAll('details.pl>summary').forEach(function(sm){sm.insertAdjacentHTML('beforeend','<span class="more"><span class="lbl"><span class="t1">'+bi('ดูรายละเอียด','Details')+'</span><span class="t2">'+bi('ซ่อน','Hide')+'</span></span>'+chev+'</span>')});
  // day navigation + today
  var today=jpToday(),secs=[].slice.call(document.querySelectorAll('#days .day')),nav=document.createElement('nav'),todaySec=null;
  nav.className='dnav';nav.setAttribute('aria-label','Days');
  secs.forEach(function(sec,i){
    var date=addDays(START,i),dd=+date.slice(8),sw=sec.querySelector('.sw'),col=sw?sw.style.background:'var(--muted)';
    sec.id='day'+(i+1);sec.dataset.date=date;
    var a=document.createElement('a');a.href='#day'+(i+1);
    a.innerHTML=bi('วัน '+(i+1),'Day '+(i+1))+'<i>'+dd+'</i><s style="background:'+col+'"></s>';
    a.setAttribute('aria-label','Day '+(i+1)+' · '+dd+' Oct');
    var dh=sec.querySelector('.dh');
    if(date===today){sec.classList.add('today');a.classList.add('now');a.setAttribute('aria-current','date');todaySec=sec;
      dh.insertAdjacentHTML('beforeend','<span class="badge">'+bi('วันนี้','TODAY')+'</span>')}
    else if(date<today){sec.classList.add('past');a.classList.add('past');
      dh.insertAdjacentHTML('beforeend','<span class="badge done">'+bi('ผ่านแล้ว','DONE')+'</span>')}
    nav.appendChild(a);
  });
  var days=document.getElementById('days');days.parentNode.insertBefore(nav,days);

  // status line
  var st=document.createElement('div');st.className='status';st.setAttribute('aria-live','polite');
  nav.parentNode.insertBefore(st,nav);
  function paint(){
    var on=navigator.onLine,h='<span class="dot'+(on?'':' off')+'"></span>';
    if(today<DEPART){var n=dayDiff(today,DEPART);h+=bi('อีก '+n+' วันออกเดินทาง','Departure in '+n+' day'+(n>1?'s':''))}
    else if(today===DEPART){h+=bi('วันนี้ออกเดินทาง · VN614 15:55 ✈️','Departure today · VN614 15:55 ✈️')}
    else if(todaySec){var i=secs.indexOf(todaySec)+1;h+=bi('วันที่ '+i+' จาก '+secs.length+' · '+todaySec.querySelector('.dt').textContent,'Day '+i+' of '+secs.length+' · '+todaySec.querySelector('.dt').textContent)+'<button type="button" id="goToday">'+bi('ไปวันนี้','Go to today')+'</button>'}
    else if(today>END){h+=bi('จบทริปแล้ว 🙏','Trip finished 🙏')}
    if(!on)h+=' · '+bi('ออฟไลน์ ใช้ข้อมูลที่บันทึกไว้','Offline · using saved copy');
    st.innerHTML=h;
    var g=document.getElementById('goToday');if(g)g.onclick=function(){todaySec.scrollIntoView({behavior:'smooth',block:'start'})};
  }
  paint();window.addEventListener('online',paint);window.addEventListener('offline',paint);
  if(todaySec&&!location.hash)setTimeout(function(){todaySec.scrollIntoView({block:'start'})},60);

  // keep active chip in view
  var chips=[].slice.call(nav.querySelectorAll('a'));
  if('IntersectionObserver' in window){
    var io=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){var c=chips[secs.indexOf(e.target)];chips.forEach(function(x){x.style.outline=''});c.style.outline='2px solid var(--btn)';c.scrollIntoView({block:'nearest',inline:'center'})}})},{rootMargin:'-40% 0px -55% 0px'});
    secs.forEach(function(s){io.observe(s)});
  }
  initIcons(secs);
  initWx(secs);
}
async function tryPw(pw,quiet){
  var E=document.getElementById('ge'),G=document.getElementById('go');
  if(!window.crypto||!crypto.subtle){E.textContent='เบราว์เซอร์นี้ไม่รองรับ (ต้องเปิดผ่าน https) / Browser not supported';return}
  G.disabled=true;E.textContent='';
  try{var html=await unlock(pw);var A=document.getElementById('app');A.innerHTML=html;A.hidden=false;document.getElementById('gate').hidden=true;
    try{sessionStorage.setItem('jp_pw',pw);var rm=document.getElementById('rm');if(quiet==='local'||(rm&&rm.checked))localStorage.setItem('jp_pw',pw);}catch(e){}initApp();}
  catch(e){if(quiet==='local'){try{localStorage.removeItem('jp_pw')}catch(x){}}if(!quiet){E.textContent='รหัสไม่ถูกต้อง / Wrong password';document.getElementById('pw').select()}}
  G.disabled=false;
}
